name: Release
run-name: Release ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Draft release containing the verified plugin ZIPs and SHA256SUMS
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'dooc-dev/dooc-plugins' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - name: Download and verify the prepared plugins
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "dooc-linear-${TAG#v}.zip" --pattern "dooc-github-${TAG#v}.zip" --pattern "dooc-slack-${TAG#v}.zip" --pattern SHA256SUMS
          sha256sum --check SHA256SUMS
          for service in linear github slack; do
            unzip -p "dooc-${service}-${TAG#v}.zip" package.json | jq -e --arg name "dooc-$service" --arg version "${TAG#v}" '.name == $name and .version == $version and .type == "module"'
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish GitHub release
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
