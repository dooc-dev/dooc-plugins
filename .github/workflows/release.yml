name: Release
run-name: Release ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Draft release containing the verified package and SHA256SUMS
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'sasaki-s-sci/dooc-plugins' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          registry-url: https://npm.pkg.github.com
      - name: Download and verify the prepared package
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "sasaki-s-sci-dooc-plugins-${TAG#v}.tgz" --pattern SHA256SUMS
          sha256sum --check SHA256SUMS
          tar -xOf "sasaki-s-sci-dooc-plugins-${TAG#v}.tgz" package/package.json > package.json
          node -e 'const p = require("./package.json"); if (p.name !== "@sasaki-s-sci/dooc-plugins" || "v" + p.version !== process.env.TAG) process.exit(1)'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the verified archive privately
        run: npm publish "sasaki-s-sci-dooc-plugins-${TAG#v}.tgz" --ignore-scripts --access restricted --tag latest --registry https://npm.pkg.github.com
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish GitHub release
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
